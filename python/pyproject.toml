[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curve_fx_harness_client"
version = "0.1.1"
description = "Typed client and protocol models for the curve_fx_eval simulation harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Curve.fi" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/curve_fx_harness_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
